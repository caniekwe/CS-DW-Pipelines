name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in step with the base image in Dockerfile (apache/airflow:3.1.7-python3.10).
  PYTHON_VERSION: "3.10"

jobs:
  lint:
    name: Lint and repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: python -m pip install --upgrade pip flake8

      - name: Syntax errors and undefined names
        # These are real breakage, not style. Fail the build.
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Style report
        # Advisory only for now. Drop --exit-zero once the existing warnings are cleared.
        run: flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Check for committed bytecode
        # dags/__pycache__/*.pyc is currently tracked despite .gitignore. Clear it with
        #   git rm -r --cached dags/__pycache__
        # and then turn this warning into a hard failure.
        run: |
          tracked="$(git ls-files -- '*.pyc' '*.pyo' '**/__pycache__/**' || true)"
          if [ -n "$tracked" ]; then
            echo "::warning::Compiled Python files are tracked in git. Remove with: git rm -r --cached dags/__pycache__"
            echo "$tracked"
          else
            echo "No compiled Python files tracked."
          fi

      - name: Validate docker-compose file
        # .env is gitignored, so a clean checkout has none and compose refuses to read
        # the file referenced by env_file. An empty one is enough to check the syntax;
        # no real values are needed here.
        run: |
          [ -f .env ] || touch .env
          docker compose config --quiet
          echo "docker-compose.yaml is valid."

  dag-tests:
    name: DAG integrity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the Airflow image
        # Proves the Dockerfile still builds, and gives the tests the exact dependency
        # set the scheduler will run with.
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cs-dw-pipelines:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Parse and validate every DAG
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "${{ github.workspace }}/dags:/opt/airflow/dags:ro" \
            -v "${{ github.workspace }}/tests:/opt/airflow/tests:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e DAG_FOLDER=/opt/airflow/dags \
            -e AIRFLOW__CORE__EXECUTOR=LocalExecutor \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////tmp/airflow-ci.db \
            -e CONNECTION_CHECK_MAX_COUNT=0 \
            cs-dw-pipelines:ci \
            -c "pip install --quiet --no-cache-dir pytest && pytest /opt/airflow/tests -v"

  ci:
    # Single job to point branch protection at, so adding a job above does not mean
    # reconfiguring the required checks.
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, dag-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
